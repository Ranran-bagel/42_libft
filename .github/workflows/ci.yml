name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Verify library
        run: test -f libft.a

      - name: Rebuild
        run: make re

      - name: Clean
        run: make fclean